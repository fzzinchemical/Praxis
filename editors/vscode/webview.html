<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src {{cspSource}} 'wasm-unsafe-eval'; style-src {{cspSource}}; connect-src {{cspSource}}">
<title>Praxis</title>
<link rel="stylesheet" href="{{uiStyle}}">
<script type="module" src="{{uiScript}}"></script>
</head>
<body>
<main>
<div id="output" role="log" tabindex="0" aria-live="polite" aria-label="Conversation"></div>
<p id="status-bar" class="status-bar" role="status" aria-label="Agent status"></p>
<p id="resources" class="resources" aria-label="System resources" title="Host RAM and GPU VRAM, used of total"></p>
<form id="prompt-form">
<label for="prompt" class="visually-hidden">Message</label>
<section id="queue" class="queue" aria-label="Queued prompts" hidden>
<p id="queue-status" class="queue-status" hidden>Queue paused. <button type="button" id="queue-resume">Resume</button></p>
<ol id="queue-list"></ol>
</section>
<textarea id="prompt" rows="2" aria-autocomplete="list" aria-controls="commands" placeholder="Ask Praxis. Enter sends, Shift+Enter adds a line. Shift+drag files here to attach."></textarea>
<div class="command-menu">
<div id="commands" class="commands" role="listbox" aria-label="Commands" hidden></div>
<div id="command-doc" class="command-doc" role="status" aria-live="polite" hidden></div>
</div>
<div id="context-bar" class="context-bar" role="group" aria-label="Attached context">
<div id="chips" class="chips"></div>
<button type="button" id="add-file" class="secondary">Add file</button>
<label class="toggle" title="Also send the errors and warnings VS Code shows for the active file (the Problems panel), so the agent can fix them."><input type="checkbox" id="problems"> Include problems</label>
</div>
<div class="composer-row">
<div id="model-bar" class="model-bar">
<label for="model">Model</label>
<select id="model" disabled></select>
<label for="mode">Permissions</label>
<select id="mode" disabled></select>
<button type="button" id="profile-gear" class="secondary" aria-label="Model settings" title="Model settings" aria-expanded="false" aria-controls="profile-popover" disabled>⚙</button>
<div id="profile-popover" class="profile-popover" role="dialog" aria-label="Model settings" tabindex="-1" hidden>
<div id="profile-fields"></div>
<p class="profile-hint">Saved values apply from the next chat. Escape closes.</p>
<button type="button" id="profile-save">Save</button>
</div>
</div>
<div class="composer-actions">
<button type="button" id="stop" class="secondary">Stop</button>
<button type="submit">Send</button>
</div>
</div>
</form>
</main>
</body>
</html>
