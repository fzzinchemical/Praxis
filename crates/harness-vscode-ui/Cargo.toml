[package]
name = "harness-vscode-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# Must equal the installed wasm-bindgen CLI exactly (AGENTS.md gotcha).
wasm-bindgen = "=0.2.128"
serde_json = "1"
web-sys = { version = "=0.3.105", features = ["DataTransfer", "DomTokenList", "DragEvent", "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlFormElement", "HtmlInputElement", "HtmlOptionElement", "HtmlSelectElement", "HtmlTextAreaElement", "KeyboardEvent", "MessageEvent", "NodeList", "Window"] }
# Markdown in the webview (SPEC §3); `html` only, no CLI.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
js-sys = "=0.3.105"

[lints]
workspace = true
