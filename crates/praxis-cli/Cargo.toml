[package]
name = "praxis-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "praxis"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
agent-client-protocol = { version = "5.0", features = ["stdio"] }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
praxis-core = { path = "../praxis-core" }
serde_json = "1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
wiremock = "0.6"
