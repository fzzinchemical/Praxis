[package]
name = "praxis-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
regex = "1.13"
ignore = "0.4"
jsonschema = { version = "0.60", default-features = false }
landlock = "0.4"
reqwest = { version = "0.13", features = ["stream", "json"] }
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
toml = "1.2"
tracing = "0.1"

[dev-dependencies]
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
wiremock = "0.6"

# Its own `main`, so the test binary can also run as the MCP server it starts.
[[test]]
name = "mcp"
harness = false

[lints]
workspace = true
