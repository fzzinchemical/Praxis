[package]
name = "harness-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
jsonschema = { version = "0.60", default-features = false }
landlock = "0.4"
reqwest = { version = "0.13", features = ["stream", "json"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
toml = "1.2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
wiremock = "0.6"

[lints]
workspace = true
