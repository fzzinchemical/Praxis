[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
harness-core = { path = "../crates/harness-core" }
serde_json = "1"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "1.2"
zip = { version = "9.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
wiremock = "0.6"

[lints]
workspace = true
