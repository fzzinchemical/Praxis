[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Wasm crates stay out so plain `cargo test` and `cargo build` stay native.
default-members = ["crates/praxis-core", "crates/praxis-cli", "xtask"]

[workspace.package]
version = "2.0.0-beta"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# Line tables keep backtraces readable; full debug info made a cold test build 9.2 GB (F8).
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Keep unwinding: a panicking tool task becomes a tool error, not a dead session (SPEC §2).
panic = "unwind"

# wasm32's prebuilt std is panic=abort, so it can't take the release profile's unwind.
[profile.wasm-release]
inherits = "release"
panic = "abort"
opt-level = "s"
